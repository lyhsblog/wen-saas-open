# Wen SaaS Boot 公共配置
# 敏感配置（DB 密码、Redis 密码、OSS Secret、JWT 密钥等）不入 git，由环境变量或配置中心注入

spring:
  application:
    name: wen-saas-boot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 定时任务存储：Quartz JDBC 集群模式，表在 PG 独立 quartz schema（Flyway V1.0.14 建表，
  # 故 initialize-schema=never）。集群内一次触发仅一个节点认领，停机漏跑恢复后补跑。
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz:
        scheduler:
          instanceId: AUTO
        jobStore:
          driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
          tablePrefix: quartz.qrtz_
          isClustered: "true"
          clusterCheckinInterval: "15000"
          useProperties: "true"
  # 共享 DataSource 属性（各 profile 仅声明 url/user/pwd 等）
  # stringtype=unspecified：PG JDBC 默认 setString 走 VARCHAR，会让 jsonb 列写入失败；
  # unspecified 让 PG 按目标列类型自动推断（对 varchar/text 零影响），无需各 profile URL 加参数。
  datasource:
    hikari:
      data-source-properties:
        stringtype: unspecified
  # JDK 25 Loom 虚拟线程（Spring Boot 4 原生支持），IO 密集型场景启用
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  # 文件上传体积上限。不显式配置时 Spring 默认 max-file-size=1MB，会早于各业务的大小守卫
  # （file.max-size=100MB / ticket 单附件 10MB·单工单 50MB / 导入 Excel 等）把 >1MB 的合法上传拦成 413，
  # 使服务层守卫成死代码。这里对齐最大业务诉求 100MB，超限由各服务层守卫给出友好业务错误兜底。
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  # Flyway 分模块：底座迁移在 classpath:db/migration/core（独立 flyway_schema_history）；
  # 业务模块各自 classpath:db/migration/<code>，由 ModuleSchemaMigrator 用独立 history 表执行。
  flyway:
    enabled: true
    locations: classpath:db/migration/core
    baseline-on-migrate: true
    # 基线版本设为 0：即便 schema 非空触发 baseline-on-migrate 自动基线，
    # 基线版本(0) 仍低于 V1.0.0，V1.0.0__init_schema.sql 不会被当成"已包含在基线里"而跳过。
    # （历史问题：默认 baselineVersion=1 与 V1.0.0 视为同版本，导致首个迁移被跳过）
    baseline-version: 0
    validate-on-migrate: true
  # 邮件 SMTP（通知通道 EmailChannelAdapter）。dev/test 留空 + notification.email-noop=true 不真发；
  # prod 配齐 host/username/password 并把 email-noop 改 false 即真发
  mail:
    host: ${SPRING_MAIL_HOST:smtpdm.aliyun.com}
    port: ${SPRING_MAIL_PORT:465}
    # 发信地址与密码为敏感项，不入 git：真实值走部署目录 .env（见 .env.example，方案 A）
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true

# Spring Boot Actuator：健康检查与监控指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  # JavaMailSender 一旦装配，Spring Boot 默认注册的 MailHealthIndicator 会每次 /health 真连 SMTP；
  # dev / test / 凭据未就绪时连不上会污染健康检查（jakarta.mail.AuthenticationFailedException）。
  # 邮件投递成功率本就由 wen-saas-boot.notification.email-noop + RocketMQ 重试覆盖，这里关掉无损
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

# Wen SaaS Boot 业务模块开关
# 通过该配置可在运行时跳过业务模块的 SPI 注册
wen-saas-boot:
  business-modules:
    enabled: {}
  # 运营域
  ops:
    # 初始运营超管（sys_user id=1）邮箱：密文列无法由迁移 SQL 写入，启动时若为空则加密回填。
    # 部署方在 .env 里用 WEN_SAAS_BOOT_OPS_INITIAL_ADMIN_EMAIL 注入真实邮箱（见 .env.example）
    initial-admin-email: ${WEN_SAAS_BOOT_OPS_INITIAL_ADMIN_EMAIL:ops-admin@example.com}
  # 多租户拦截器配置
  # platform-only-tables 是纯平台表白名单，这些表不带 tenant_id 字段，
  # MyBatis-Plus TenantLineInnerInterceptor 跳过 tenant_id 注入。
  tenant:
    # 租户前端裸域 origin：开通租户时后端把租户 code 前缀为子域，拼完整设密码链接放进激活邮件
    # （形如 https://{code}.example.com/reset-password/...；配裸域、无尾部斜杠）。
    web-base-url: ${TENANT_WEB_BASE_URL:http://localhost:5174}
    # 租户活跃度校验缓存（TenantActivityGuard，走统一 CacheRegion；本地条目上限见 wen-saas-boot.cache.region-local-cache-size）
    activity-guard:
      cache-ttl-seconds: 300      # 本地兜底 TTL，默认 5 分钟（精确失效靠写后 evict 经 pub/sub 广播）
    platform-only-tables:
      - sys_tenant
      - sys_business_module
      - sys_menu
      - sys_package
      - sys_package_module
      - sys_recommended_role_template
      - sys_recommended_role_template_package
      - sys_recommended_role_template_permission
      - sys_recommended_role_template_activation
      - flyway_schema_history
      - sys_password_reset_token
      - sys_tenant_seat_addon
      - sys_mfa_config
      - sys_mfa_recovery_code
      - sys_setting
      - sys_tenant_health
      - sys_tenant_route_alias
      - sys_audit_table_config   # ③ 列元数据，全局配置表（无 tenant_id），渲染数据变更详情时查
      - sys_mq_dead_letter       # MQ 死信兜底表（M7），跨租户 + 监控无租户上下文写入
  # 认证与会话
  auth:
    # HS256 秘钥；prod 必须由环境变量 WEN_SAAS_BOOT_JWT_SECRET 注入，至少 32 字节
    jwt-secret: ${WEN_SAAS_BOOT_JWT_SECRET:dev-only-secret-please-change-in-prod-32bytes!}
    issuer: wen-saas-boot
    token-ttl: 2h
    reset-token-ttl: 48h
    permit-all:
      - /api/auth/login
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      # 文件存储 v2：Local 后端真实下载/上传端点（HMAC 自带鉴权，bypass UserContext）
      - /api/v1/files/local-download
      - /api/v1/files/local-upload
      # 开放 API：JWT AuthenticationFilter 让出，鉴权由 AppKeyAuthenticationFilter 接管
      - /api/v1/openapi/**
      # 公开租户信息（租户子域登录页解析租户名/Logo 用）
      - /api/v1/public/**
      # OpenAPI spec JSON（无 UI 版，前端 AI 工具链消费）
      - /v3/api-docs
      - /v3/api-docs/**
      - /favicon.ico
    # UserContext 未注入时，是否回退到 X-Tenant-Id header（dev 默认 true、prod 默认 false）
    allow-tenant-id-header: false
  # 权限引擎
  # enabled=false 时整体不装配（@RequirePermission AOP + 数据权限拦截器都不生效）
  permission:
    enabled: true
    cache-ttl: 1h
  # 字典框架
  # enabled=false 时整体不装配；启动期 DictSpiSynchronizer 也不跑
  dict:
    enabled: true
    cache-ttl: 1h
  # 自定义字段框架
  # enabled=false 时整体不装配；CustomFieldService / DefManager / 表达式索引执行器都不生效
  customfield:
    enabled: true
    cache-ttl: 1h
    default-field-quota: 20
    default-index-quota: 5
    # v2 业务端拦截器：WriteInterceptor 自动校验 + QueryRewriter SELECT 翻译
    # 关闭后 v1 行为：业务方主动调 customFieldService.validateValues + 手写 extra->>'cf_xxx'
    interceptor-enabled: true
  # 操作日志
  # enabled=false 时落回 NoopAuditLogRecorder；RocketMQ Producer/Consumer 都不装配
  audit:
    enabled: true
    # RocketMQ topic 命名只允许 [%|a-zA-Z0-9_-]，不能含点号；用下划线分隔
    operation-topic: wen_audit_operation
    login-topic: wen_audit_login
    operation-consumer-group: wen-saas-boot-audit-op
    login-consumer-group: wen-saas-boot-audit-login
    batch-size: 100
    batch-flush-interval: 5s
    # 消费重试上限由 wen-saas-boot.mq.dead-letter.max-delivery-attempts 统一控制
  # MQ 消费可靠性 / 死信兜底
  # 死信落库内聚在消费链路：毒丸即 ack 落库；瞬时异常达 max-delivery-attempts 落库并 ack（不再交 broker 投 %DLQ%）
  mq:
    dead-letter:
      enabled: true
      max-delivery-attempts: 3
      body-truncate-bytes: 8000
  # 任务中心
  # enabled=false 时 TaskService / TaskRunner / TaskExecutionConsumer 均不装配
  task:
    enabled: true
    execute-topic: wen_task_execute
    execute-consumer-group: wen-saas-boot-task-execute
    progress-key-ttl: 1d
    progress-update-throttle-ms: 200
    expires-ttl: 30d
    cancel-flag-ttl: 1h
  # 文件存储抽象层
  # enabled=false 时由 NoopFileConfiguration 兜底注入"调用即抛 NO_ACTIVE_BACKEND"的 FileService
  file:
    enabled: true
    # 多版本密钥。轮转：新增 v2 key + 切 active-key-id=v2 重启；旧 archived 密文按 keyId 路由解密。
    encryption-keys:
      default: ${WEN_SAAS_BOOT_FILE_AES_KEY:ZGV2LW9ubHktYWVzLWtleS1ub3QtZm9yLXByb2QhISE=}
      # v2: ${WEN_SAAS_BOOT_FILE_AES_KEY_V2:}
    active-key-id: default
    max-size: 100MB
    download-url-ttl: 4m
    signed-url-ttl: 5m
    # 租户无 active 配置时走该后端：local（本地磁盘，dev/private）/ aliyun_oss / tencent_cos
    platform-default-backend: local
    local:
      root: ${WEN_SAAS_BOOT_FILE_LOCAL_ROOT:./data/files}
    # 平台默认 OSS（platform-default-backend=aliyun_oss 时启用）
    platform-oss:
      endpoint: ${WEN_SAAS_BOOT_PLATFORM_OSS_ENDPOINT:}
      bucket: ${WEN_SAAS_BOOT_PLATFORM_OSS_BUCKET:}
      access-key-id: ${WEN_SAAS_BOOT_PLATFORM_OSS_AK:}
      access-key-secret: ${WEN_SAAS_BOOT_PLATFORM_OSS_SK:}
      path-prefix: ${WEN_SAAS_BOOT_PLATFORM_OSS_PREFIX:}
    # 平台默认腾讯云 COS（platform-default-backend=tencent_cos 时启用）。
    # endpoint 为 COS region code（如 ap-guangzhou），非域名；access-key-id/secret 对应 SecretId/SecretKey。
    platform-tencent-cos:
      endpoint: ${WEN_SAAS_BOOT_PLATFORM_COS_REGION:}
      bucket: ${WEN_SAAS_BOOT_PLATFORM_COS_BUCKET:}
      access-key-id: ${WEN_SAAS_BOOT_PLATFORM_COS_SECRET_ID:}
      access-key-secret: ${WEN_SAAS_BOOT_PLATFORM_COS_SECRET_KEY:}
      path-prefix: ${WEN_SAAS_BOOT_PLATFORM_COS_PREFIX:}
  # 通知模板与多通道分发
  # enabled=false 时由 NoopNotificationConfiguration 兜底（业务方 send 仅打日志）
  notification:
    enabled: true
    # RocketMQ topic 命名只允许 [%|a-zA-Z0-9_-]
    station-topic: wen_notify_station
    email-topic: wen_notify_email
    sms-topic: wen_notify_sms
    im-topic: wen_notify_im
    station-consumer-group: wen-saas-boot-notify-station
    email-consumer-group: wen-saas-boot-notify-email
    sms-consumer-group: wen-saas-boot-notify-sms
    im-consumer-group: wen-saas-boot-notify-im
    template-cache-ttl: 1h
    retry-times: 3
    retry-backoff:
      - 1s
      - 5s
      - 30s
    # dev/test 默认不真发邮件；prod 配 spring.mail.* 后改 false
    email-noop: ${NOTIFICATION_EMAIL_NOOP:true}
    # 发件人 From；留空走 spring.mail 默认。阿里云 DirectMail 须配「显示名 <发信地址>」且地址与
    # spring.mail.username 一致，例：Wen-SaaS <no-reply@mail.example.com>
    email-from: ${SPRING_MAIL_FROM:}
  # 短信通道（阿里云短信）。凭据未就绪时 noop=true 仅打日志
  sms:
    noop: ${WEN_SAAS_BOOT_SMS_NOOP:true}
    access-key-id: ${ALIYUN_SMS_AK:}
    access-key-secret: ${ALIYUN_SMS_SK:}
    sign-name: ${ALIYUN_SMS_SIGN:}
    endpoint: dysmsapi.aliyuncs.com
    # 内部 templateCode -> 阿里云已审核 templateCode（凭据到位后补全）
    template-mapping: {}
  # 验证码（OTP）通用能力：MFA / 改手机号双通道共用
  verification:
    code-length: 6
    ttl: 5m
    resend-interval: 60s
    daily-limit: 10
    max-verify-attempts: 5
  # 开放 API 鉴权 / 限流 / 调用日志
  # enabled=false 时 AppKeyAuthenticationFilter / RateLimiter / ApiCallLogFilter 都不装配
  openapi:
    enabled: true
    path-prefix: /api/v1/openapi
    # 子路径白名单（如健康探针），无 AppKey 也可访问
    permit-all: []
    timestamp-skew: 5m
    auth-cache-ttl: 5m
    max-body-bytes: 1MB
    rate-limit:
      enabled: true
      window: 60s
      default-limit: 1000
      tenant-overrides: {}
      # Redis key 设计预留凭证级层位：v1 仅租户级 {tenantId}；P1 加 {tenantId}:{apiKeyId}
      key-prefix: wen-saas-boot:openapi:ratelimit
    call-log:
      enabled: true
      topic: wen_api_call_log
      consumer-group: wen-saas-boot-api-call-log
      batch-size: 100
      batch-flush-interval: 5s
  # 业务领域事件总线
  # 业务方调 domainEventPublisher.publish(...) → RocketMQ wen_event → WebhookDispatcherConsumer 扇出
  event:
    enabled: true
    topic: wen_event
    dispatcher-consumer-group: wen-saas-boot-event-dispatcher
  # Webhook 推送
  # 重试 3 次 + 指数退避 5s/30s/5min；v1 不做"连续失败自动 disable"，留 v2
  webhook:
    enabled: true
    send-topic: wen_webhook_send
    sender-consumer-group: wen-saas-boot-webhook-sender
    http-connect-timeout: 3s
    http-read-timeout: 10s
    retry-times: 3
    retry-backoff:
      - 5s
      - 30s
      - 5m
    body-truncate-bytes: 4000
    signature-header: X-Wen-Signature
    timestamp-header: X-Wen-Timestamp
    event-header: X-Wen-Event
    event-id-header: X-Wen-Event-Id
  # OpenAPI 文档
  # 仅 spec JSON 端点（/v3/api-docs），不带 Swagger UI；前端 AI 工具链消费即可
  openapi-doc:
    enabled: true
    # 描述性 metadata 由 core-web/openapi/OpenApiConfiguration 注入
  # Web 层公共契约
  # CORS：dev 三端独立 Vite dev port；prod 同源部署可置空关闭
  web:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:5174
        - http://localhost:5175
      allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowed-headers: ["*"]
      exposed-headers: [X-Request-Id]
      allow-credentials: true
      max-age: 30m
  # 定时任务总开关（默认开）：false 的节点不装配 Job 且 Quartz 不启动、不参与集群认领
  # 各任务默认 cron 在代码内，可按 jobKey 覆盖，如 cron.tenant-expire: "0 5 0 * * ?"
  jobs:
    enabled: true
