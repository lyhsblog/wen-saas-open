# core-impl 模块测试用配置（连本机 PG wen_saas 库 + 本机 Redis）
# Flyway 禁用：dev 已跑过 V1.0.0 等迁移；测试期间用 JdbcTemplate 自建临时表

spring:
  application:
    name: wen-saas-boot-core-impl-test
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/wen_saas
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # 与 app/application.yml 对齐，让 PG 按列类型推断（jsonb 写入需要）
        stringtype: unspecified
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: root
      database: 0
      timeout: 3000ms
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      # v5 gRPC starter 的自动装配（排除后测试上下文不启动真实 push consumer/producer）
      - org.apache.rocketmq.client.autoconfigure.RocketMQAutoConfiguration

management:
  endpoints:
    enabled-by-default: false

wen-saas-boot:
  # 测试不装配定时任务（部分 Job 依赖 MQ Publisher 等测试上下文没有的 Bean）
  jobs:
    enabled: false
  tenant:
    platform-only-tables:
      - sys_tenant
      - sys_business_module
      - sys_menu
      - sys_package
      - sys_package_module
      - sys_recommended_role_template
      - sys_recommended_role_template_package
      - sys_recommended_role_template_permission
      - sys_recommended_role_template_activation
      - flyway_schema_history
      - sys_password_reset_token
      - sys_tenant_seat_addon
      - sys_setting
      - sys_tenant_health
      - sys_tenant_route_alias
      - sys_audit_table_config
      - sys_mq_dead_letter
      # v2 自定义字段拦截器集成测试自建表（CustomFieldInterceptorIntegrationTest$CfTestEntity）
      # 测试期间不属任何业务模块，需加入白名单让 ModuleTableValidator 跳过；
      # 与 v1 cf_test_obj 走 jdbc 直操（不带 Mapper）不同，v2 必须走 Mapper 才能触发拦截器
      - cf_intercept_obj
      # SPI v2 集成测试 stub 表（AItem@TableName(a_item)，@Mapper 被全局 MapperScan 扫到）。
      # OpsBusinessModuleDescriptor 是首个生产 @BusinessModule，使 ModuleTableValidator 在所有
      # TestApp 上下文生效；a_item 只在 SpiV2 上下文归属 module a，其余上下文需白名单跳过。
      - a_item
  auth:
    jwt-secret: test-only-secret-please-do-not-use-in-prod-32bytes!
    issuer: wen-saas-boot
    token-ttl: 30m
    reset-token-ttl: 48h
    permit-all:
      - /api/auth/login
      - /actuator/health
    allow-tenant-id-header: true
  # 测试默认关闭 audit（无 RocketMQ broker）；集成测试通过 @TestPropertySource 局部启用
  audit:
    enabled: false
  # 测试默认关闭 task（无 RocketMQ broker）；TaskCenterIntegrationTest 通过 @TestPropertySource 局部启用，
  # 端到端跳过 MQ 直接调用 TaskRunner.run() 验证状态机 + 进度跟踪
  task:
    enabled: false
  # 测试默认关闭 notification（无 RocketMQ broker）；集成测试通过 @TestPropertySource 局部启用，
  # 单元测试直调 MessageServiceImpl / TemplateDataLoader 等组件
  notification:
    enabled: false
  # 测试默认关闭 openapi / event / webhook（无 RocketMQ broker）；集成测试 @TestPropertySource 局部启用
  openapi:
    enabled: false
  event:
    enabled: false
  webhook:
    enabled: false
  # 文件存储测试默认启用 LocalAdapter（不依赖 OSS）；aes-key = "test-aes-key-for-unit-only-32by!"
  file:
    enabled: true
    encryption-keys:
      default: dGVzdC1hZXMta2V5LWZvci11bml0LW9ubHktMzJieSE=
    active-key-id: default
    max-size: 100MB
    download-url-ttl: 4m
    signed-url-ttl: 5m
    platform-default-backend: local
    local:
      root: ./build/test-files

logging:
  level:
    root: WARN
    com.wensaas: INFO
    org.mybatis: DEBUG
