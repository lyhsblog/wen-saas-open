# 生产入口：三端静态站 + /api 同源反代（域名默认 567cc.cc）。
# 源站 ssl/ 为自签证书；前面挂 Cloudflare 时见 README「Cloudflare」一节。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare 回源常走 80 并带 X-Forwarded-Proto:https，须透传给后端（refresh cookie / 同源）
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream wen_saas_backend {
    server backend:8080;
    keepalive 32;
}

# ---- 运营端 ops.567cc.cc ----
server {
    listen 80;
    server_name ops.567cc.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # 仅「直连 HTTP、非 CF 已终结 HTTPS」时跳转到 https；避免 Flexible 模式 301 死循环
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    root /var/www/ops;
    index index.html;
    include /etc/nginx/conf.d/snippets/wen_saas_common_locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ops.567cc.cc;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /var/www/ops;
    index index.html;
    include /etc/nginx/conf.d/snippets/wen_saas_common_locations.conf;
}

# ---- H5 m.567cc.cc / *.m.567cc.cc ----
server {
    listen 80;
    server_name m.567cc.cc *.m.567cc.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    root /var/www/h5;
    index index.html;
    include /etc/nginx/conf.d/snippets/wen_saas_common_locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name m.567cc.cc *.m.567cc.cc;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /var/www/h5;
    index index.html;
    include /etc/nginx/conf.d/snippets/wen_saas_common_locations.conf;
}

# ---- 租户端 567cc.cc / *.567cc.cc（ops / m 已由上面精确 server_name 优先）----
server {
    listen 80;
    server_name 567cc.cc *.567cc.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    root /var/www/tenant;
    index index.html;
    include /etc/nginx/conf.d/snippets/wen_saas_common_locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 567cc.cc *.567cc.cc;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /var/www/tenant;
    index index.html;
    include /etc/nginx/conf.d/snippets/wen_saas_common_locations.conf;
}
