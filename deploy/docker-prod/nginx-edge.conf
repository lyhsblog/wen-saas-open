# 生产入口：三端静态站 + /api 同源反代（域名默认 567cc.cc，改域请同步 gateway 构建参数与本文件 server_name）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wen_saas_backend {
    server backend:8080;
    keepalive 32;
}

# HTTP → HTTPS（证书挂载在 /etc/nginx/ssl/ 时生效）
server {
    listen 80;
    server_name ops.567cc.cc 567cc.cc *.567cc.cc m.567cc.cc *.m.567cc.cc;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ops.567cc.cc;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root /var/www/ops;
    index index.html;

    location /api/ {
        proxy_http_version 1.1;
        proxy_pass http://wen_saas_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        client_max_body_size 120m;
    }

    location = /actuator/health {
        proxy_pass http://wen_saas_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name m.567cc.cc *.m.567cc.cc;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

