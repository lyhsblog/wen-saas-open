# 全容器编排（同目录 docker-compose.yml）专用 broker 配置。
# brokerIP1 通告为 compose 服务名：proxy 与后端都在同一 compose 网络内，按服务名直连。
# （宿主机直跑模式的 broker.conf 在 wen-saas-boot/local_environment/conf/，
#   那份通告 host.docker.internal 供宿主机进程回连，两份勿混用。）
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerIP1=rocketmq-broker
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
