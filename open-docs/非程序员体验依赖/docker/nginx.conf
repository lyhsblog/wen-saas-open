# 全容器编排里前端三端共用的 nginx 站点配置模板（由同目录 docker-compose.yml 挂载，
# 各端镜像内是各自构建好的 dist 产物）。监听端口由环境变量 NGINX_PORT 注入
# （nginx 镜像 entrypoint 对 templates/ 做 envsubst），与宿主机映射保持同端口（5173/5174/5175）。
server {
    listen ${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端接口反代（compose 服务名互联）。上传类接口带文件，放宽请求体限制。
    # 后端开启了 forward-headers-strategy=framework，X-Forwarded-* 必须发全套：
    # 只发 Proto 不发 Host/Port 会让后端把端口视为 80，同源判断失效 → CORS 403。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        client_max_body_size 100m;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 带内容哈希的构建产物可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 路由回退；页面入口不落缓存，重建镜像后浏览器刷新即见新版本
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
